# OneShelf: one container, explicit mounts, loopback by default.
#
# `./install.sh` from the repository root drives this file. Everything a person would reasonably change
# lives in `.env` beside it — see `.env.example` — so this file rarely needs editing.
name: oneshelf

services:
  oneshelf:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${ONESHELF_IMAGE:-oneshelf:local}
    restart: unless-stopped
    ports:
      # Loopback only. Publishing on the LAN is a deliberate change: set ONESHELF_BIND to 0.0.0.0 *and*
      # ONESHELF_TRUSTED_NETWORKS to the subnet you actually trust (Master §28.1, §28.2).
      - "${ONESHELF_BIND:-127.0.0.1}:${ONESHELF_PORT:-8420}:8420"
    environment:
      ONESHELF_TRUSTED_NETWORKS: "${ONESHELF_TRUSTED_NETWORKS:-}"
      ONESHELF_TRUSTED_PROXIES: "${ONESHELF_TRUSTED_PROXIES:-}"
      ONESHELF_ALLOWED_HOSTS: "${ONESHELF_ALLOWED_HOSTS:-localhost}"
      ONESHELF_DATA_DIR: /data
      ONESHELF_PLUGIN_DIR: /plugins
      ONESHELF_SESSION_KEY_FILE: /keys/session.key
      ONESHELF_WEB_ROOT: /app/web
    volumes:
      - ${ONESHELF_DATA_PATH:-./volumes/data}:/data           # oneshelf.db, cache.db, secrets.db, staging, diagnostics
      - ${ONESHELF_PLUGIN_PATH:-./volumes/plugins}:/plugins   # installed .osp packages
      - ${ONESHELF_KEYS_PATH:-./volumes/keys}:/keys           # the session key: its own volume, backed up separately
      - ${ONESHELF_CONTENT_PATH:-./volumes/content}:/content  # a storage root for downloaded and imported content
      - ${ONESHELF_BACKUP_PATH:-./volumes/backups}:/backups   # .osbackup archives; ideally a different physical disk
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8420/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
