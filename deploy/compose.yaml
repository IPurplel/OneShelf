# OneShelf: one container, explicit mounts, loopback by default.
#
# `./install.sh` from the repository root drives this file. Everything a person would reasonably change
# lives in `.env` at the repository root — see `.env.example` — so this file rarely needs editing.
name: oneshelf

services:
  oneshelf:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${ONESHELF_IMAGE:-oneshelf:local}
    restart: unless-stopped
    init: true
    # Linux host networking preserves the real peer IP for the LAN/passkey boundary.
    # Bridge/rootless port proxies can make every visitor look like the same gateway.
    network_mode: host
    environment:
      ONESHELF_HOST: "${ONESHELF_BIND:-127.0.0.1}"
      ONESHELF_PORT: "${ONESHELF_PORT:-8420}"
      ONESHELF_TRUSTED_NETWORKS: "${ONESHELF_TRUSTED_NETWORKS:-}"
      ONESHELF_TRUSTED_PROXIES: "${ONESHELF_TRUSTED_PROXIES:-}"
      ONESHELF_ALLOWED_HOSTS: "${ONESHELF_ALLOWED_HOSTS:-localhost}"
      ONESHELF_DATA_DIR: /data
      ONESHELF_LEGACY_DATA_DIR: /legacy-data
      ONESHELF_SESSION_KEY_FILE: /keys/session.key
      ONESHELF_WEB_ROOT: /app/web
    volumes:
      # Read-only view prevents a pre-release updater from hiding legacy nested files.
      - ${ONESHELF_DATA_PATH:-./volumes/data}:/legacy-data:ro,z
      - ${ONESHELF_DATA_PATH:-./volumes/data}:/data:z           # oneshelf.db, cache.db, secrets.db, staging, diagnostics
      - ${ONESHELF_PLUGIN_PATH:-./volumes/plugins}:/data/plugins:z   # installed .osp packages
      - ${ONESHELF_KEYS_PATH:-./volumes/keys}:/keys:z           # the session key: its own volume, backed up separately
      - ${ONESHELF_CONTENT_PATH:-./volumes/content}:/content:z  # a storage root for downloaded and imported content
      - ${ONESHELF_BACKUP_PATH:-./volumes/backups}:/data/backups:z   # .osbackup archives; ideally a different physical disk
