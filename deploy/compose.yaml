# OneShelf: one container, explicit mounts, loopback by default.
#
# `./install.sh` from the repository root drives this file. Everything a person would reasonably change
# lives in `.env` at the repository root — see `.env.example` — so this file rarely needs editing.
name: oneshelf

services:
  oneshelf:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${ONESHELF_IMAGE:-oneshelf:local}
    restart: unless-stopped
    init: true
    # Linux host networking preserves the real peer IP for the LAN/passkey boundary.
    # Bridge/rootless port proxies can make every visitor look like the same gateway.
    network_mode: host
    environment:
      ONESHELF_HOST: "${ONESHELF_BIND:-127.0.0.1}"
      ONESHELF_PORT: "${ONESHELF_PORT:-8420}"
      ONESHELF_TRUSTED_NETWORKS: "${ONESHELF_TRUSTED_NETWORKS:-}"
      ONESHELF_TRUSTED_PROXIES: "${ONESHELF_TRUSTED_PROXIES:-}"
      ONESHELF_ALLOWED_HOSTS: "${ONESHELF_ALLOWED_HOSTS:-localhost}"
      ONESHELF_DATA_DIR: /data
      ONESHELF_LEGACY_DATA_DIR: /legacy-data
      ONESHELF_SESSION_KEY_FILE: /keys/session.key
      ONESHELF_WEB_ROOT: /app/web
      # The OneShelf Source Registry, published from IPurplel/OneShelf-Adapters. Contacted only when the
      # Sources screen asks; `ONESHELF_REGISTRY_URL=`
      # (set, empty) in .env switches it off. No colon in `${VAR-default}` on purpose: an unset value gets
      # the default, an empty one keeps it off.
      ONESHELF_REGISTRY_URL: "${ONESHELF_REGISTRY_URL-https://raw.githubusercontent.com/IPurplel/OneShelf-Adapters/registry/index.json}"
      # The Registry whose repository-controlled tiers (Official, Verified Community) are trusted without a
      # signature. Only a Registry URL exactly equal to this one earns that; any other stays Community unless
      # a trusted key signs it. Empty = no first-party Registry (the safer behaviour).
      ONESHELF_FIRST_PARTY_REGISTRY_URL: "${ONESHELF_FIRST_PARTY_REGISTRY_URL-https://raw.githubusercontent.com/IPurplel/OneShelf-Adapters/registry/index.json}"
      # Public Ed25519 keys only ("key-id:base64,..."); list two while rotating. A private key never goes here.
      ONESHELF_REGISTRY_TRUSTED_KEYS: "${ONESHELF_REGISTRY_TRUSTED_KEYS-}"
      # DNS-over-HTTPS JSON endpoint for ECH keys (sources with network.ech, e.g. Noor Book); that resolver
      # learns which source hosts you use. Same `${VAR-default}` rule as the Registry: unset gets Cloudflare,
      # `ONESHELF_ECH_DOH_URL=` (set, empty) contacts none and those sources then say they need it.
      ONESHELF_ECH_DOH_URL: "${ONESHELF_ECH_DOH_URL-https://cloudflare-dns.com/dns-query}"
      # The address lan-proxy connects from. Only it may say who the real visitor is (X-Forwarded-For);
      # container_start adds it to ONESHELF_TRUSTED_PROXIES. Nothing else on this machine uses it.
      ONESHELF_LAN_PROXY_ADDRESS: "127.0.0.2"
    volumes:
      # Read-only view prevents a pre-release updater from hiding legacy nested files.
      - ${ONESHELF_DATA_PATH:-./volumes/data}:/legacy-data:ro,z
      - ${ONESHELF_DATA_PATH:-./volumes/data}:/data:z           # oneshelf.db, cache.db, secrets.db, staging, diagnostics
      - ${ONESHELF_PLUGIN_PATH:-./volumes/plugins}:/data/plugins:z   # installed .osp packages
      - ${ONESHELF_KEYS_PATH:-./volumes/keys}:/keys:z           # the session key: its own volume, backed up separately
      - ${ONESHELF_CONTENT_PATH:-./volumes/content}:/content:z  # a storage root for downloaded and imported content
      - ${ONESHELF_BACKUP_PATH:-./volumes/backups}:/data/backups:z   # .osbackup archives; ideally a different physical disk

  # Serves OneShelf to the local network on ONESHELF_LAN_PORT (80 by default: http://<this machine>/, no
  # port to type), with compression and long-lived caching of the interface files. OneShelf itself stays on
  # this machine only. Started by ./install.sh and ./update.sh when ONESHELF_LAN_PROXY=on (the default) and
  # the port is free; by hand: `--profile lan`. Host networking keeps each visitor's real address.
  lan-proxy:
    image: docker.io/library/nginx:1.28.0-alpine
    container_name: oneshelf-lan-proxy
    profiles: ["lan"]
    restart: unless-stopped
    network_mode: host
    depends_on: [oneshelf]
    environment:
      ONESHELF_PORT: "${ONESHELF_PORT:-8420}"
      ONESHELF_LAN_PORT: "${ONESHELF_LAN_PORT:-80}"
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      # Replaces the image's own default site, which would otherwise also claim port 80.
      - ./nginx/oneshelf.conf.template:/etc/nginx/templates/default.conf.template:ro,z
