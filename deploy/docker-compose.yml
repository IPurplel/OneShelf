name: oneshelf

services:
  oneshelf:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    platform: linux/amd64
    container_name: oneshelf
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - downloads:/data/manga
      - config:/config
    shm_size: 1gb
    environment:
      TZ: Etc/UTC
      MD_HOST: 0.0.0.0
      MD_PORT: "8080"
      MD_CONFIG_FILE: /config/config.yaml
      MD_OUTPUT_DIR: /data/manga
      MD_CONFIG_DIR: /config
    # Allow Chromium's child processes in this trusted-LAN deployment.
    security_opt:
      - seccomp=unconfined

volumes:
  downloads:
    name: oneshelf_downloads
  config:
    name: oneshelf_config
