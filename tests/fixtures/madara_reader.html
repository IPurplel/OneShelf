<!doctype html>
<!-- Synthetic Madara reader page.

     Exercises the traps that break naive scrapers:
       * real URL in data-src, placeholder in src
       * whitespace/newline padding inside the attribute value
       * a srcset with multiple widths
       * theme chrome (logo, spinner) that must not be mistaken for a page -->
<html lang="en">
<body class="wp-manga reading-manga">
  <div class="c-blog-post">
    <img src="https://example.net/wp-content/themes/madara/images/logo.png" alt="logo">

    <div class="reading-content">
      <div class="page-break no-gaps">
        <img id="image-0" class="wp-manga-chapter-img"
             src="https://example.net/wp-content/themes/madara/images/loading.gif"
             data-src="
                https://cdn.example.net/uploads/example-series/ch-1/001.jpg
             " alt="Page 1">
      </div>
      <div class="page-break no-gaps">
        <img id="image-1" class="wp-manga-chapter-img"
             data-src="	https://cdn.example.net/uploads/example-series/ch-1/002.jpg	"
             alt="Page 2">
      </div>
      <div class="page-break no-gaps">
        <img id="image-2" class="wp-manga-chapter-img"
             srcset="https://cdn.example.net/uploads/example-series/ch-1/003-400.jpg 400w,
                     https://cdn.example.net/uploads/example-series/ch-1/003-1600.jpg 1600w,
                     https://cdn.example.net/uploads/example-series/ch-1/003-800.jpg 800w"
             alt="Page 3">
      </div>
      <div class="page-break no-gaps">
        <img id="image-3" class="wp-manga-chapter-img"
             data-src="//cdn.example.net/uploads/example-series/ch-1/004.webp"
             alt="Page 4">
      </div>
    </div>

    <div class="entry-header">
      <img src="https://example.net/wp-content/uploads/spinner.gif" alt="">
    </div>
  </div>
</body>
</html>
