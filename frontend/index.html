<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3eee5" />
    <!-- Added to a phone's home screen, OneShelf opens full-screen like an app. The manifest asks with
         credentials so that it is also found by someone signed in from outside the home network. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OneShelf" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        const saved = localStorage.getItem("oneshelf.theme");
        const choice = saved === "light" || saved === "dark" ? saved : "system";
        document.documentElement.dataset.theme = choice;
        document.documentElement.dataset.resolvedTheme = choice === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : choice;
        if (document.documentElement.dataset.resolvedTheme === "dark")
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#111b15");
      } catch {
        document.documentElement.dataset.theme = "system";
        document.documentElement.dataset.resolvedTheme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark" : "light";
      }
    </script>
    <title>OneShelf</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
