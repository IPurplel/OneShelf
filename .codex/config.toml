[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.83", "--browser=chromium", "--headless", "--isolated", "--output-dir=qa-artifacts", "--console-level=info"]
startup_timeout_sec = 30
tool_timeout_sec = 60
default_tools_approval_mode = "approve"
enabled_tools = [
  "browser_navigate", "browser_navigate_back", "browser_snapshot", "browser_take_screenshot",
  "browser_click", "browser_type", "browser_fill_form", "browser_press_key",
  "browser_select_option", "browser_handle_dialog", "browser_resize", "browser_emulate_media",
  "browser_hover", "browser_find", "browser_tabs", "browser_wait_for",
  "browser_console_messages", "browser_network_requests", "browser_network_request"
]
