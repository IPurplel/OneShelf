# Text reading units (plugin API 1.2): the reader yields a chapter's markup, which Core sanitises.
capability: reader
inputs:
- unit_key
request:
  url: '{base_url}/api/units/{unit_key:path}/text'
  auth: optional
response:
  format: json
extract:
  items:
    json: $.chapter
  fields:
    html:
      json: $.html
    title:
      json: $.title
pagination:
  mode: none
  complete_when: single_response
