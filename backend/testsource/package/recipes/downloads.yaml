capability: downloads
inputs: [unit_key]
request:
  url: "{base_url}/api/units/{unit_key:path}/files"
response:
  format: json
extract:
  items: {json: "$.files[*]"}
  fields:
    url: {json: "$.url", transforms: [normalize_url], required: true}
    format: {json: "$.format", required: true}
pagination:
  mode: none
  complete_when: single_response
