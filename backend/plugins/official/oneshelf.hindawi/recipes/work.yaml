capability: work
inputs: [listing_key]
request:
  url: "{base_url}/books/{listing_key:path}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  fields:
    title: {css: "article.book .details h2::text", required: true, transforms: [trim]}
    creator: {css: "article.book .details .author a::text", transforms: [trim]}
    description: {css: "article.book .details .content p::text", transforms: [trim]}
    cover_url: {css: "meta[property='og:image']::attr(content)", transforms: [normalize_url]}
