# A Hindawi book is one Reading Unit: the book itself (Master §4.4).
capability: catalog
inputs: [listing_key]
request:
  url: "{base_url}/books/{listing_key:path}/"
  headers: {Accept: text/html}
response:
  format: html
extract:
  items: {css: "article.book"}
  order: source_listed
  fields:
    unit_key: {template: "{listing_key}", required: true}
    title: {css: ".details h2::text", transforms: [trim]}
    # A whole book is the Master's `one_shot`: one complete unit. "book" is not a unit type,
    # and a value outside the vocabulary becomes "unknown", which says less than the truth.
    unit_type: {template: "one_shot"}
pagination:
  mode: none
  complete_when: single_response
