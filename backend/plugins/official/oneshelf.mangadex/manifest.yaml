schema: oneshelf.osp/1
id: oneshelf.mangadex
name: MangaDex
version: 1.0.0
api: '1.0'
description: >-
  MangaDex through its public JSON API. Search, work metadata, the chapter feed for one language and
  reader pages from the at-home server. No login is required for public content.
publisher: OneShelf
capabilities:
  - search
  - work
  - catalog
  - reader
  - health
network:
  domains:
    - api.mangadex.org
  cdn_domains:
    - uploads.mangadex.org
    - '*.mangadex.network'
defaults:
  language: en
