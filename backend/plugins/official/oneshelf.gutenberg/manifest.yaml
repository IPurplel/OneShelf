schema: oneshelf.osp/1
id: oneshelf.gutenberg
name: "Project Gutenberg · Books · EN"
version: 2.0.1
api: '1.0'
description: >-
  Project Gutenberg's public domain books, read from gutenberg.org's own per-book OPDS entries, with EPUB
  downloads from gutenberg.org. No account is needed. No search: gutenberg.org's robots.txt disallows its
  search, and Gutendex's disallows the /books/ API this adapter used before 2.0.0, so a book is added by
  pasting its gutenberg.org address.
publisher: OneShelf
capabilities: [work, catalog, downloads]
network:
  domains: [www.gutenberg.org]
defaults:
  language: en
  content_type: book
