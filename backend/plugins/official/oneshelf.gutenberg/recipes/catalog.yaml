# A Gutenberg book is one Reading Unit: the book itself, the Master's one_shot (§4.4).
capability: catalog
inputs: [listing_key]
request:
  url: "{base_url}/ebooks/{listing_key:path}.opds"
  headers: {Accept: application/atom+xml}
response:
  format: html
extract:
  items: {xpath: "(//entry)[1]"}
  fields:
    unit_key: {template: "{listing_key}", required: true}
    title: {xpath: "title/text()", transforms: [trim]}
    unit_type: {template: "one_shot"}
pagination:
  mode: none
  complete_when: single_response
