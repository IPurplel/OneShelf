# The EPUB 3 with images — the edition this adapter has always offered — from the book's OPDS entry.
capability: downloads
inputs: [unit_key]
request:
  url: "{base_url}/ebooks/{unit_key:path}.opds"
  headers: {Accept: application/atom+xml}
response:
  format: html
extract:
  items: {xpath: "(//entry/link[@type='application/epub+zip'][contains(@href, '.epub3.images')])[1]"}
  fields:
    url: {xpath: "@href", required: true, transforms: [normalize_url]}
    format: {template: "epub", required: true}
pagination:
  mode: none
  complete_when: single_response
