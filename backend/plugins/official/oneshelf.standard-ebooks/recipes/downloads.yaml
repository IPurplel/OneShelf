capability: downloads
inputs: [unit_key]
request:
  url: "{base_url}/feeds/opds/all?query={unit_key}"
response:
  format: html
extract:
  items: {css: "entry link[type='application/epub+zip']"}
  fields:
    url: {css: "::attr(href)", required: true}
    format: {template: "epub", required: true}
pagination:
  mode: none
  complete_when: single_response
