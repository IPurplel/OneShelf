# One ebook is one Reading Unit — a whole book is the Master's one_shot (§4.4); its formats are the
# downloads capability's (§41.3). Only the entry whose id is the key counts: see work.yaml.
capability: catalog
inputs: [listing_key]
request:
  url: "{base_url}/feeds/opds/all?query={listing_key}"
response:
  format: html
extract:
  items: {xpath: "//entry[translate(substring-after(id,'/ebooks/'),'/','2')=translate(substring-before(substring-after(//feed/id,'query='),'&'),'%F','')]"}
  order: source_listed
  fields:
    unit_key:
      xpath: "id/text()"
      transforms: [{regex_extract: {pattern: 'standardebooks\.org/ebooks/(.+)$', group: 1}}]
      required: true
    title: {xpath: "title/text()", transforms: [trim]}
    url: {xpath: "id/text()"}
    release_date: {xpath: "published/text()", transforms: [parse_date]}
    unit_type: {template: "one_shot"}
pagination:
  mode: none
  complete_when: single_response
