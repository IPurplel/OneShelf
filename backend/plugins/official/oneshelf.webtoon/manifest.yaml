schema: oneshelf.osp/1
id: oneshelf.webtoon
name: WEBTOON
version: 1.0.0
api: '1.0'
description: >-
  WEBTOON series by direct URL: the work page and its episode list. Search is deliberately absent
  because webtoons.com's robots.txt disallows /*/search for every crawler. Reader pages are not
  provided either: the viewer loads its images with JavaScript, so only thumbnails are in the HTML.
  Both gaps are recorded in the source capability ledger rather than worked around.
publisher: OneShelf
capabilities: [work, catalog]
network:
  domains: [www.webtoons.com]
  cdn_domains: ['*.pstatic.net']
defaults:
  language: en
