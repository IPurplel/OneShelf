# The book page. Its h1 and og:title read "تحميل كتاب … pdf"; the bare title is the h2 under the cover.
capability: work
inputs: [listing_key]
request:
  url: "{base_url}/{listing_key}"
  headers: {Accept: text/html}
response:
  format: html
extract:
  fields:
    title:
      css: "#trans_title_here::text"
      required: true
      transforms: [trim]
    creator:
      css: "#book-writer::text"
      transforms: [trim]
    description:
      css: "p.book_desc span.more::text"
      transforms: [trim]
    cover_url:
      css: "img.media-object[itemprop='image']::attr(src)"
      transforms: [normalize_url]
    language:
      css: "[itemprop='inLanguage']::attr(content)"
      transforms: [trim]
