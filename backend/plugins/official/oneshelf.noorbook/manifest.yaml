schema: oneshelf.osp/1
id: oneshelf.noorbook
name: "Noor Book · Books · AR"
version: 1.1.0
api: '1.3'
description: >-
  Arabic and translated books from noor-book.com: search, book details and covers. The site is reached
  over Cloudflare Encrypted Client Hello (ECH), so the adapter declares ech: true and Core uses the
  curl_cffi transport. Reading and downloading are not offered: the site only serves book pages after a
  per-session token handshake that this adapter does not reproduce.
publisher: OneShelf
capabilities: [search, work, catalog]
network:
  domains: [www.noor-book.com]
  ech: true
defaults:
  language: ar
  content_type: book
