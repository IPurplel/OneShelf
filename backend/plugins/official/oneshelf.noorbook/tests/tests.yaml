# Fixture tests exercise the real static parser. Complete browser/group flow is tested in Core.
cases:
  # search.html is sliced verbatim from the live search page (captured 2026-10-30): three results, the
  # third withdrawn for copyright (a review link, nothing to open), so it is skipped.
  - capability: search
    inputs: {query: "الليالي البيضاء"}
    fixtures:
      - url: "https://www.noor-book.com/?search_for=%D8%A7%D9%84%D9%84%D9%8A%D8%A7%D9%84%D9%8A%20%D8%A7%D9%84%D8%A8%D9%8A%D8%B6%D8%A7%D8%A1"
        file: fixtures/search.html
    expect:
      min_items: 2
      complete: true
      fields_present: [listing_key, title, cover_url, url]
      first:
        listing_key: "/%D9%83%D8%AA%D8%A7%D8%A8-%D8%A7%D9%84%D9%84%D9%8A%D8%A7%D9%84%D9%8A-%D8%A7%D9%84%D8%A8%D9%8A%D8%B6%D8%A7%D8%A1-%D8%AF%D9%88%D8%B3%D8%AA%D9%88%D9%8A%D9%81%D8%B3%D9%83%D9%8A-pdf"
        title: "الليالي البيضاء"
        creator: "فيودور دوستويفسكي"
        cover_url: "https://www.noor-book.com/publice/covers_cache_jpg/9/9/5/a/857b3068b995a1f3abd18552397f2051.png.jpg"
  - capability: work
    inputs: {listing_key: /en/ebook-test-pdf}
    fixtures:
      - {url: 'https://www.noor-book.com/en/ebook-test-pdf', file: fixtures/book.html}
    expect:
      first: {title: White Nights, language: ar, creator: Dostoevsky}
  - capability: catalog
    inputs: {listing_key: /en/ebook-test-pdf}
    fixtures:
      - {url: 'https://www.noor-book.com/en/ebook-test-pdf', file: fixtures/book.html}
    expect:
      min_items: 1
      complete: true
      first: {unit_key: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa:0', title: White Nights}
