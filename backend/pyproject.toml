[project]
name = "oneshelf"
version = "0.1.0"
description = "OneShelf: self-hosted personal reading library"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.53",
    "Pillow>=12.3",
    "pypdf>=6.19",
    "defusedxml>=0.7.1",
    "PyYAML>=6.0.3",
    "google-re2>=1.1.20251105",
    "cryptography>=50.0.1",
    # WebAuthn/passkeys for remote access (Master §28.3); verified on Python 3.14.
    "webauthn>=3.0.0",
    "aiohttp>=3.14.3",
    "playwright>=1.63.0",
    # Parser only. Never install the "fetchers" extra (stealth/fingerprint stack; ledger K1).
    "scrapling>=0.4.15",
]

[project.optional-dependencies]
dev = ["pytest>=9.1", "httpx2>=2.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oneshelf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["browser: requires Playwright Chromium"]
filterwarnings = [
    "error",
    # Third-party: starlette.testclient still references a deprecated anyio alias (not OneShelf code).
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # Third-party: scrapling passes lxml's no-op strip_cdata option (not OneShelf code).
    "ignore:The 'strip_cdata' option of HTMLParser:DeprecationWarning",
]
