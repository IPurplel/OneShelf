capability: work
inputs: [listing_key]
request:
  url: "{base_url}/episodeList?titleNo={listing_key}"
response:
  format: html
extract:
  fields:
    title: {css: "h1.subj::text", transforms: [trim], required: true}
    cover_url: {css: "meta[property='og:image']::attr(content)", transforms: [normalize_url]}
    content_type: {template: "webtoon"}
