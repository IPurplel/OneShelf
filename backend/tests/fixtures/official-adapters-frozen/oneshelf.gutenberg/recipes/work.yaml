capability: work
inputs: [listing_key]
request:
  url: "{base_url}/books/{listing_key:path}"
  headers: {Accept: application/json}
response:
  format: json
extract:
  fields:
    title: {json: "$.title", transforms: [trim], required: true}
    creator: {json: "$.authors[0].name"}
    description: {json: "$.summaries[0]"}
    language: {json: "$.languages[0]"}
    cover_url: {json: "$.formats['image/jpeg']"}
    content_type: {template: "book"}
