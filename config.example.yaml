# OneShelf configuration reference (no need to copy this for deployment).
#
# Every key here can also be set as an environment variable with an MD_ prefix
# (MD_OUTPUT_DIR, MD_IMAGE_CONCURRENCY, ...). Environment variables win over
# this file, which is what makes the Docker path configurable without editing
# anything inside the container.
#
# The keys marked "UI-editable" can also be changed from the Settings view at
# runtime, and are written back to this file.

# --- server -----------------------------------------------------------------
host: 0.0.0.0
port: 8080

# --- storage ----------------------------------------------------------------
# Where .cbz files are written. Layout is <output_dir>/<Series>/<Series> - cNNN.cbz
output_dir: /data/manga          # UI-editable
# Database and the persistent Chromium profile live here. Keep it on a volume
# so a solved Cloudflare clearance survives a restart.
config_dir: /config

# --- browser / Cloudflare ---------------------------------------------------
# auto | true | false.
#
# "auto" starts headless (cheap, and enough for the plain JS challenge) and
# escalates to a headful browser under a virtual display if a challenge will
# not clear. Headless Chromium takes different rendering and input code paths
# and those differences are readable from JavaScript.
#
# Needs xvfb installed for the escalation to be possible in a container; the
# Docker image includes it. Falls back to headless if there is no display.
headless: auto

# Prefer the patchright driver when installed. Stock Playwright is detectable
# through the automation protocol itself rather than through anything in the
# DOM, so patching navigator properties does not help; patchright ships those
# leaks already removed. Set false to pin stock Playwright when debugging.
stealth: true

# Which browser to drive: auto | chrome | msedge | chromium.
# Playwright's bundled Chromium is a developer build - unsigned, missing the
# proprietary codecs a shipped browser has - and a bot check can tell. "auto"
# drives real Chrome or Edge when one is installed, and falls back to bundled.
browser_channel: auto

# Allow starting Xvfb so a headful browser can run with no X server present.
virtual_display: true

# Solve attempts per host before giving up. Each retry clears that host's
# cookies first, so it is a fresh challenge rather than a replay of the failed
# one - without that, every retry fails identically.
challenge_attempts: 3

# Click the Turnstile checkbox when a challenge presents one. Measured on the
# live target: with clicking off the challenge never issued clearance at all;
# with it on, clearance was issued in ~20s. Leave on.
challenge_click: true

# Attach to a browser YOU are already running, instead of launching one.
#
# This is the dependable answer to an interactive Turnstile. Automated solving
# of it does not work - measured against neutral Cloudflare test sites with a
# patched driver, a current Chromium, real Chrome, and headful: all fail.
# Turnstile checks that input events come from the operating system, and events
# synthesised over the automation protocol do not.
#
# So don't fight it. Clear the check by hand, once, in your own browser:
#
#   Windows:  chrome.exe --remote-debugging-port=9222 --user-data-dir="C:\cdp-profile"
#   Linux:    google-chrome --remote-debugging-port=9222 --user-data-dir=/tmp/cdp
#
# Load the site, pass the check, leave the window open, then set:
#
#   browser_cdp: http://127.0.0.1:9222
#
# The app drives that browser: its cookies, its TLS fingerprint, its exit IP.
# Images that a plain HTTP request cannot get are refetched through it
# automatically. headless, browser_channel and virtual_display are ignored.
#
# Leave blank to have the app run its own browser.
browser_cdp:                     # UI-editable

# How long to wait for an interstitial to clear before giving up.
challenge_timeout: 60.0
navigation_timeout: 45.0

# --- network ----------------------------------------------------------------
# Some networks block sites by reading the hostname out of the plaintext TLS
# ClientHello and injecting a TCP reset - the connection dies before any HTTP
# response exists. Such filters are passive and usually do not reassemble TCP,
# so splitting the handshake across two segments leaves them nothing to match.
#
# Enabling this starts a local SOCKS5 proxy that applies that split, and routes
# both the browser and the downloader through it. No external service needed.
# Ignored if `proxy` below is set.
desync_enabled: false            # UI-editable
desync_split: 1                  # bytes in the first segment; small is what works
desync_delay: 0.05               # seconds between segments
desync_port: 8081                # fixed so you can point your own browser at it


# Route everything through a proxy. Applies to the browser AND the image
# downloader together - they must share an exit IP, because a Cloudflare
# clearance cookie is bound to the address that earned it.
#
# Needed when your network filters the target host. Many ISPs block sites by
# reading the hostname out of the TLS handshake, which resets the connection
# before any HTTP response exists; a proxy moves that handshake elsewhere.
# With SOCKS5 the DNS lookup happens at the proxy too.
#
#   proxy: socks5://127.0.0.1:1080          # e.g. `ssh -D 1080 -N user@vps`
#   proxy: http://user:pass@proxy.lan:8080
#
# Leave unset (or blank) for a direct connection.
proxy:                           # UI-editable

# --- search -----------------------------------------------------------------
# The sites the search box queries, in order. Listing this key replaces the
# built-in list entirely rather than adding to it, so include every site you
# want searched.
#
# The default is the 21 sites that have each produced a real, inspected file on
# disk - the entry requirement, because a site that only *searches* looks
# supported and is not. SOURCES.md carries the artifact, its byte size and its
# page or chapter count for each; app/config.py holds the list itself, with the
# reason beside every site that was left out.
#
# Notably absent are sunovels.com and arabic-book.net, whose downloads work
# fine: neither can answer a query truthfully - one ignores search parameters
# and returns its catalogue, the other renders a "latest posts" widget in the
# same markup as results - so both are paste-by-URL only.
#
# Add any site the app supports. The adapter is chosen by fingerprinting the
# page, not by hostname, so nothing else needs to change. A site that fails or
# times out is skipped, never fatal.
#
#   search_sites:
#     - https://mangadex.org
#     - https://www.gutenberg.org
#
# As an environment variable this one takes a JSON array, not a comma-separated
# string: MD_SEARCH_SITES='["https://mangadex.org","https://www.gutenberg.org"]'

# Seconds any single site gets to answer before it is dropped from the results.
# Every site is queried in parallel, so this is the ceiling on a whole search,
# not a per-site cost added up. Raising it makes a slow source reachable at the
# price of every search waiting on it.
search_timeout: 20.0

# --- download engine --------------------------------------------------------
# Total in-flight requests is roughly chapter_concurrency x image_concurrency.
# The defaults are deliberately modest: getting the IP banned costs far more
# time than the extra throughput ever saves.
chapter_concurrency: 2           # UI-editable
image_concurrency: 6             # UI-editable
requests_per_second: 4.0         # UI-editable, per host
host_requests_per_second:        # Additional ceilings; never raise the cap above
  noor-book.com: 0.5             # Anonymous reader: one page request per 2 seconds
max_retries: 3                   # UI-editable, per image
request_timeout: 60.0

# --- output -----------------------------------------------------------------
# Strip CDN resize parameters and unwrap image proxies to fetch originals.
# Turn off only if a site serves broken originals; the site-supplied URL is
# always kept as a fallback either way.
prefer_original_quality: true    # UI-editable

# ComicInfo.xml LanguageISO, and the translation MangaDex is asked for.
# "en" for English, "ar" for the Arabic sources.
language: en                     # UI-editable

# Fallback page direction, used only where an adapter does not declare its own.
# Adapters that know better override it, so the Arabic sources stay
# right-to-left whatever this says. Set true if your untagged sources are
# Japanese or Arabic releases; false suits Western comics and webtoons.
right_to_left: false
