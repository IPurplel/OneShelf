# Publishes the container image to GitHub Container Registry.
#
# This is what makes the one-line install possible: without a pullable image,
# deploy/docker-compose.yml has to build from source, which means every user
# needs a clone and several minutes of build time.
#
# NOTE: a GHCR package is created private. After the first successful run the
# package visibility has to be flipped to public once, by hand, under
# Packages -> oneshelf -> Package settings -> Change visibility. Until that is
# done `docker pull` fails for everyone but the owner.
name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR rejects uppercase, and the owner is `IPurplel`, so this is spelled out
  # rather than derived from github.repository.
  IMAGE_NAME: ipurplel/oneshelf

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          # Root context: the Dockerfile copies requirements.txt, app/ and web/
          # from the repository root, the same way deploy/docker-compose.yml
          # uses `context: ..`.
          context: .
          file: deploy/Dockerfile
          # amd64 only. The Chrome apt source in the Dockerfile is pinned to
          # arch=amd64, so an arm64 image would silently lose real Chrome and
          # with it the ability to clear a Cloudflare check.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_CHROME=1
          cache-from: type=gha
          cache-to: type=gha,mode=max
